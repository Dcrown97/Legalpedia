name: 🚀 Deploy update on merge to dev
on:
  push:
    branches:
      - dev-review
jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: 📂 Sync files
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.legalpediaonline.com
          username: developer@staging.legalpediaresources.com
          password: ${{ secrets.stagingpassword }}
          protocol: ftps
