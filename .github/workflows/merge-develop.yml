name: 🚀 Deploy update on merge to dev
on:
  push:
    branches:
      - develop
jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: 📂 Sync files
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: 162.0.235.154
          port: 22
          username: developer@staging.legalpediaresources.com
          password: ${{ secrets.STAGINGPASSWORD }}
