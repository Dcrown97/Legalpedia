name: 🚀 Deploy update on merge to dev
on:
  push:
    branches:
      - develop

jobs:
  web-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: 📂 Sync files via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: 162.0.235.154
          port: 22
          username: developer@staging.legalpediaresources.com
          password: ${{ secrets.STAGINGPASSWORD }}
          local_path: "./"   # files to upload
          remote_path: "/home/legaxdfh/teststaging"
          sftp_only: true
