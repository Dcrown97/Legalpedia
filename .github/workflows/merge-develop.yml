name: 🚀 Deploy update on merge to dev
on:
  push:
    branches:
      - develop

jobs:
  web-deploy:
    name: 🎉 SSH Deploy
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      # Upload project files via scp
      - name: 📂 Upload files to server
        uses: appleboy/scp-action@master
        with:
          host: 162.0.235.154
          username: legaxdfh
          # password: ${{ secrets.STAGINGPASSWORD }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 21098
          source: "./"
          target: "/home/legaxdfh/teststaging"
          strip_components: 1

      # Run commands on the server after upload
      - name: 🛠 Run remote commands
        uses: appleboy/ssh-action@master
        with:
          host: 162.0.235.154
          username: legaxdfh
          # password: ${{ secrets.STAGINGPASSWORD }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 21098
          script: |
            cd /home/legaxdfh/teststaging
            php artisan config:clear
            php artisan cache:clear
            php artisan migrate --force
