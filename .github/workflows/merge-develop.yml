name: 🚀 Deploy via SSH

on:
  push:
    branches:
      - dev-review

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout code
        uses: actions/checkout@v4

      - name: 🚀 Deploy using SSH
        uses: easingthemes/ssh-deploy@v2.1.5
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST: 162.0.235.154
          REMOTE_USER: legaxdfh  # Your cPanel username
          TARGET: /home/legaxdfh/teststaging
          EXCLUDE: .git,.github,node_modules
