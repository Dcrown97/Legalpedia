name: 🚀 Deploy update on merge to dev
on:
  push:
    branches:
      - develop
jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: SFTP Deploy
        uses: appleboy/scp-action@master
        with:
          host: ftp.staging.legalpediaresources.com
          username: developer@staging.legalpediaresources.com
          password: ${{ secrets.STAGINGPASSWORD }}
          source: "/home/legaxdfh/teststaging"
          target: "/home/legaxdfh/teststaging"